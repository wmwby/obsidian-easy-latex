name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation for main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Generate artifact attestation for styles.css
        if: hashFiles('styles.css') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css

      - name: Generate artifact attestation for manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
